# Sequential merging experiment. Same format as ../config.yaml.
# Stages benchmarked: M, M+a1, M+a1+a2, M+a1+a2+a3, M+a1+a2+a3+a4
# Each adapter is folded in as W <- W + (alpha / rank) * B @ A (PEFT's own scaling).
# `merge` and per-adapter `weight` are not used by this experiment.
model:
  base_model: Qwen/Qwen2.5-3B-Instruct
  dtype: bfloat16
  device_map: cuda
  trust_remote_code: true
  adapters:
    - name: a1
      path: Akarshika/qwen25-3b-text2sql-lora
    - name: a2
      path: madokalif/qwen2.5-3b-translation-warmup-adapter
    - name: a3
      path: balaguhanesh/tool-call-ft
    - name: a4
      path: Pilestin/qwen2.5-3b-debug-v1-lora

generation:
  max_new_tokens: 512
  do_sample: false   # greedy: deterministic, so stage differences come from the weights, not sampling noise
  temperature: 0.7
  top_p: 0.95
  top_k: 50
  repetition_penalty: 1.0
  batch_size: 16
  seed: 42
  system_prompt: null

datasets:
  cache_dir: data_cache
  harmbench:
    enabled: true
    functional_categories: [standard, contextual]
    max_examples: null        # all examples
  advbench:
    enabled: true
    max_examples: null        # all examples
  alpaca:
    enabled: true
    num_samples: 500          # same fixed 500 prompts at every stage (null = all 52k, very slow)
    seed: 42

detectors:
  llama_guard3:
    enabled: true
    model_id: meta-llama/Llama-Guard-3-8B
    device_map: auto     # splits across GPUs if one is too small (8B bf16 = 16GB)
    max_new_tokens: 20
    batch_size: 32
  harm_cls:
    enabled: true
    model_id: cais/HarmBench-Llama-2-13b-cls
    device_map: auto     # 13B bf16 = 26GB, needs 2 x 15GB GPUs or one big one
    batch_size: 16
    max_generation_tokens: 512
  rejection:
    enabled: true
    model_id: ProtectAI/distilroberta-base-rejection-v1
    batch_size: 32
    max_length: 512
  keyword_refusal:
    enabled: true
    check_first_chars: 200
    phrases: null

output:
  root: sequential_merging/results
