datasets:
  advbench:
    enabled: false
    max_examples: null
  alpaca:
    enabled: false
    num_samples: 500
    seed: 42
  cache_dir: data_cache
  harmbench:
    enabled: true
    functional_categories:
    - standard
    - contextual
    max_examples: null
detectors:
  harm_cls:
    batch_size: 16
    device_map: cuda
    enabled: true
    max_generation_tokens: 512
    model_id: cais/HarmBench-Llama-2-13b-cls
  keyword_refusal:
    check_first_chars: 200
    enabled: false
    phrases: null
  llama_guard3:
    device_map: cuda
    enabled: true
    max_new_tokens: 20
    model_id: meta-llama/Llama-Guard-3-8B
  rejection:
    batch_size: 32
    enabled: false
    max_length: 512
    model_id: ProtectAI/distilroberta-base-rejection-v1
generation:
  batch_size: 32
  do_sample: true
  max_new_tokens: 512
  repetition_penalty: 1.0
  seed: 42
  system_prompt: null
  temperature: 0.7
  top_k: 50
  top_p: 0.95
merge:
  density: null
  majority_sign_method: total
  strategy: linear
  svd_rank: null
model:
  adapters: []
  base_model: Qwen/Qwen2.5-3B-Instruct
  device_map: cuda
  dtype: bfloat16
  trust_remote_code: true
output:
  root: results/experiment4/base
