# ---------------------------------------------------------------------------
# Model under test.
#   adapters: []      -> benchmark the base model alone
#   1 adapter         -> load it into the base model (merge settings unused)
#   2+ adapters       -> merge them using the `merge` section below
# ---------------------------------------------------------------------------
model:
  base_model: "Qwen/Qwen2.5-3B-Instruct"   # <-- replace with your base model
  dtype: bfloat16
  device_map: cuda
  trust_remote_code: true
  adapters:
    - name: a1
      path: "Pilestin/qwen2.5-3b-debug-v1-lora"
      weight: 0.5

# ---------------------------------------------------------------------------
# How to merge (only used when 2+ adapters are given).
# strategy: linear | cat | svd | ties | ties_svd | dare_linear | dare_linear_svd
#           | dare_ties | dare_ties_svd | magnitude_prune | magnitude_prune_svd
# density is required for ties, dare_* and magnitude_prune (value in (0, 1]).
# ---------------------------------------------------------------------------
merge:
  strategy: ties
  density: 0.5
  majority_sign_method: total   # "total" or "frequency" (ties / dare_ties only)
  svd_rank: null                # only for *_svd strategies

# ---------------------------------------------------------------------------
# Inference hyperparameters. With do_sample: false (greedy), temperature,
# top_p and top_k are ignored.
# ---------------------------------------------------------------------------
generation:
  max_new_tokens: 512
  do_sample: true
  temperature: 0.7
  top_p: 0.95
  top_k: 50
  repetition_penalty: 1.0
  batch_size: 16
  seed: 42
  system_prompt: null

datasets:
  cache_dir: data_cache
  harmbench:
    enabled: true
    functional_categories: [standard, contextual]
    max_examples: null          # set e.g. 20 for a quick smoke test
  advbench:
    enabled: true
    max_examples: null
  alpaca:
    enabled: true
    num_samples: 500
    seed: 42

detectors:
  llama_guard3:
    enabled: true
    model_id: meta-llama/Llama-Guard-3-8B
    device_map: cuda
    max_new_tokens: 20
  harm_cls:
    enabled: true
    model_id: cais/HarmBench-Llama-2-13b-cls
    device_map: cuda
    batch_size: 8
    max_generation_tokens: 512
  rejection:                    # refusal detector for FRR (small model, also fine on CPU)
    enabled: true
    model_id: ProtectAI/distilroberta-base-rejection-v1
    batch_size: 32
    max_length: 512
  keyword_refusal:
    enabled: true
    check_first_chars: 200  
    phrases: null 

output:
  root: results
