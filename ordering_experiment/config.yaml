# Adapter-order experiment (LINEAR chain and TIES chain over all 24 orders of 4 adapters).
# Same format as ../config.yaml, plus the `ordering` section. `merge` and per-adapter `weight` are not used.
model:
  base_model: Qwen/Qwen2.5-3B-Instruct
  dtype: bfloat16
  device_map: cuda
  trust_remote_code: true
  adapters:
    - name: a1
      path: Akarshika/qwen25-3b-text2sql-lora
    - name: a2
      path: madokalif/qwen2.5-3b-translation-warmup-adapter
    - name: a3
      path: balaguhanesh/tool-call-ft
    - name: a4
      path: Pilestin/qwen2.5-3b-debug-v1-lora

ordering:
  ties_density: 0.5      # fraction of largest-magnitude entries kept in each TIES merge
  workers: 0             # generation worker processes, one per GPU (0 = use all visible GPUs)
  # Admission gates for experiment 3 (ASR increase vs the previous model / vs the base model M0).
  # A path is checked against every (eps, tau) pair in the grid.
  gate_eps: [0.01, 0.02, 0.05]    # local gate: reject a step if ASR_k - ASR_{k-1} > eps
  gate_tau: [0.02, 0.05, 0.10]    # cumulative gate: reject a step if ASR_k - ASR_0 > tau

generation:
  max_new_tokens: 512
  do_sample: false
  temperature: 0.7
  top_p: 0.95
  top_k: 50
  repetition_penalty: 1.0
  batch_size: 256     # big GPU; a batch that runs out of memory is split in half automatically
  seed: 42
  system_prompt: null

datasets:
  cache_dir: data_cache
  harmbench:
    enabled: true
    functional_categories: [standard, contextual]
    max_examples: null
  advbench:
    enabled: true
    max_examples: null
  alpaca:
    enabled: true
    num_samples: 500
    seed: 42

detectors:
  llama_guard3:
    enabled: true
    model_id: meta-llama/Llama-Guard-3-8B
    device_map: auto
    max_new_tokens: 20
    batch_size: 16
  harm_cls:
    enabled: true
    model_id: cais/HarmBench-Llama-2-13b-cls
    device_map: auto
    batch_size: 8
    max_generation_tokens: 512
  rejection:
    enabled: true
    model_id: ProtectAI/distilroberta-base-rejection-v1
    batch_size: 32
    max_length: 512
  keyword_refusal:
    enabled: true
    check_first_chars: 200
    phrases: null

output:
  root: ordering_experiment/results
